---
- name: Prepare
  hosts:
    - subjects
  roles:
    - role: trippsc2.packer.install
  tasks:
    - name: Prepare Docker
      ansible.builtin.include_tasks: "{{ _file }}"
      vars:
        _file: "{{ lookup('first_found', _params) }}"
        _params:
          files:
            - "prepare-{{ ansible_distribution }}-{{ ansible_distribution_release | default('') }}.yml"
            - "prepare-{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
            - "prepare-{{ ansible_distribution }}.yml"
            - "prepare-{{ ansible_os_family }}-{{ ansible_distribution_major_version }}.yml"
            - "prepare-{{ ansible_os_family }}.yml"
            - "prepare-fallback.yml"
          paths:
            - "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}"

    - name: Create Packer working directory
      become: true
      ansible.builtin.file:
        path: "{{ packer_working_directory }}"
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0755'
      
    - name: Copy Packer HCL file
      loop:
        - test.pkr.hcl
        - test.pkrvars.hcl
      become: true
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "{{ packer_working_directory }}/{{ item }}"
        owner: vagrant
        group: vagrant
        mode: '0644'
  handlers:
    - name: Reboot
      become: true
      listen: _reboot
      ansible.builtin.reboot:
